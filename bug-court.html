<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bug Court: Find the Guilty Line of Code</title>
<meta name="description" content="Read the evidence, usually an error message, then pick the guilty line of code. A beginner debugging game with real explanations.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("awc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
.hud{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font:700 1.05rem var(--mono);color:var(--cyan);margin:12px 0}
.case{max-width:640px;margin:14px auto;text-align:left}
.ev{background:#3d1620;color:#ffd7d7;border-left:6px solid #ff5c5c;border-radius:6px;padding:12px 14px;font:14px/1.5 var(--mono);margin:10px 0;overflow-wrap:anywhere}
.ln{display:block;width:100%;text-align:left;background:#1e1f2b;color:#e8e8f0;border:2px solid transparent;border-radius:6px;padding:9px 12px;margin:4px 0;font:15px/1.4 var(--mono);cursor:pointer;min-height:44px;white-space:pre-wrap;overflow-wrap:anywhere}
.ln:hover{border-color:var(--pink)}.ln.ok{border-color:#2ee59d;background:#12382b}.ln.bad{border-color:#ff5c5c;background:#3d1620}
.ln b{color:#8b8fb5;margin-right:10px;font-weight:400}
.clue{color:var(--orange);font-family:var(--mono);min-height:1.6em}
.exp{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.res{font:700 1.15rem var(--mono);color:var(--orange);min-height:2em}
select{background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.ctr{text-align:center}[hidden]{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="site-header"></div>
<main id="main"><div class="wrap ctr">
<section class="hero" style="padding-bottom:6px">
<h1>Bug Court</h1>
<p class="tag">Find the guilty line.</p>
<p class="sub" style="margin:0 auto">Order in court..... Read the evidence, then tap the one line of code that caused the problem. Easy shows a clue, Normal lets you ask for one, Hard gives none.</p>
</section>
<p><label for="df">Difficulty: </label><select id="df"><option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option></select></p>
<div class="hud"><span id="pg">Ready</span><span>Verdicts won: <b id="sc">0</b></span><span>Best: <b id="bs">0</b></span></div>
<section class="case" id="case" hidden aria-live="polite">
<h2 id="ct" style="margin:.2em 0"></h2>
<div class="ev" id="ev"></div>
<div class="clue" id="clue"></div>
<div id="code"></div>
<div class="exp" id="exp" hidden role="status"></div>
<p style="text-align:center"><button class="btn alt small" id="cb" type="button" hidden>Ask for a clue</button> <button class="btn" id="nx" type="button" hidden>Next case</button></p>
</section>
<div class="res" id="res" role="status"></div>
<p><button class="btn" id="go" type="button">Open the court</button> <button class="btn alt" id="sh" type="button" hidden>Copy result</button></p>
<p><a href="games.html">Back to the Games Arcade</a></p>
</div></main>
<div id="site-footer"></div>
<noscript><p style="padding:16px">This game needs JavaScript. Sir E says: Please enable it.....</p></noscript>
<script src="site.js" defer></script>
<script src="games-core.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded",function(){
"use strict";
var GC=window.GC,$=function(i){return document.getElementById(i)},NAME="bug-court",N=5;
/* ===== CASES: add more at the end. [title, evidence, code lines, guilty line number (from 0), clue, explanation] ===== */
var C=[
["The Case of the Missing Variable","Uncaught ReferenceError: score is not defined",["let points = 10;","points = points + 5;","console.log(score);","// end of file"],2,"The error names a word that was never created.","The code made a variable called points, but line 3 asks for score. Use the same name everywhere."],
["The Case of the Silent Button","Nothing happens when you click. Console: Cannot read properties of null (reading 'addEventListener')",["<button id=\"go\">Go</button>","<script>","document.getElementById(\"Go\").addEventListener(\"click\", run);","<\/script>"],2,"null means the page could not find the thing you asked for.","The button's id is go, but the code looks for Go. IDs are case sensitive, so nothing was found."],
["The Case of the Stubborn Heading","The heading should be red, but it stays blue. No error message.",["h1 {","  color: blue;","}","h1 { colour: red; }"],3,"CSS ignores words it does not know, with no error.","colour is not a real CSS property. The correct word is color, so the red rule was ignored."],
["The Case of the Frozen Page","The page freezes and the browser says it is not responding.",["let i = 0;","while (i < 5) {","  console.log(i);","  i = i - 1;","}"],3,"Ask: will i ever reach 5?","i goes down instead of up, so i < 5 is always true and the loop never ends. It should be i = i + 1."],
["The Case of the Dead Link","Clicking About shows Page not found. Files in the folder: index.html, about.html, contact.html",["<a href=\"contact.html\">Contact us</a>","<a href=\"abuot.html\">About us</a>","<a href=\"index.html\">Home</a>"],1,"Compare the link names with the file names.","The link says abuot.html but the file is about.html. A typo in a file name breaks the link."],
["The Case of the Strange Total","Expected 13 but the page shows 103.",["const price = \"10\";","const qty = 3;","console.log(price + qty);"],0,"Is price a number, or something that only looks like one?","The quotes make price text, so + joins 10 and 3 into 103. Remove the quotes to make it a number."]
];
/* ======================================================================================================== */
var Q=[],i=0,score=0,done=false,T=null;
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
$("df").value=GC.diff();$("df").onchange=function(){GC.setDiff($("df").value)};$("bs").textContent=GC.best(NAME);
function ask(){
 var q=Q[i],c=$("code"),d=GC.diff();done=false;c.textContent="";$("exp").hidden=true;$("nx").hidden=true;$("res").textContent="";
 $("case").hidden=false;$("pg").textContent="Case "+(i+1)+" of "+Q.length;$("ct").textContent=q[0];$("ev").textContent="Evidence: "+q[1];
 $("clue").textContent=d==="easy"?"Clue: "+q[4]:"";$("cb").hidden=d!=="normal";
 q[2].forEach(function(t,n){var b=document.createElement("button");b.type="button";b.className="ln";var num=document.createElement("b");num.textContent=n+1;b.append(num,document.createTextNode(t));b.onclick=function(){pick(n)};c.append(b)});
}
function pick(n){
 if(done)return;done=true;var q=Q[i],ok=n===q[3],bs=$("code").children;if(ok)score++;$("sc").textContent=score;
 bs[q[3]].className="ln ok";if(!ok)bs[n].className="ln bad";$("cb").hidden=true;
 $("exp").hidden=false;$("exp").textContent=(ok?"GUILTY! Sir E: Ok..... ":"Wrong line. The court is disappointed..... ")+q[5];
 $("nx").hidden=false;$("nx").textContent=i+1<Q.length?"Next case":"Hear the final verdict";
}
$("cb").onclick=function(){$("clue").textContent="Clue: "+Q[i][4];$("cb").hidden=true};
function end(){
 $("case").hidden=true;$("pg").textContent="Court adjourned";var nb=GC.setBest(NAME,score);$("bs").textContent=GC.best(NAME);GC.award("first");
 $("res").textContent="Verdicts won: "+score+" of "+Q.length+". "+(score===Q.length?"Perfect. Who did you copy from?.....":score>=3?"Not bad. Suspicious.....":"See me after class.....")+(nb&&score>0?" New best!":"");
 $("go").disabled=false;$("df").disabled=false;$("go").textContent="Open the court again";$("sh").hidden=false;
}
$("nx").onclick=function(){i++;if(i<Q.length)ask();else end()};
$("go").onclick=function(){Q=shuf(C).slice(0,N);i=0;score=0;$("sc").textContent=0;$("sh").hidden=true;$("go").disabled=true;$("df").disabled=true;ask()};
$("sh").onclick=function(){var t=GC.share("Bug Court",score+" of "+Q.length+" verdicts");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){$("res").textContent="Copied."},function(){});else $("res").textContent=t};
window.AWC_BC={C:C};
});
</script>
</body>
</html>
