<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Registry: 23 Fictional Coders and Their Cards</title>
<meta name="description" content="Meet 23 fictional coders: flip their cards, check their rarity, claim yours and battle two characters. Nothing here is a real person.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("awc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
label{display:block;font-weight:700;margin:10px 0 6px}
input[type=text],input[type=search],select{width:100%;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:11px;font:16px var(--font)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips button{background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font:700 .9rem var(--font);cursor:pointer;min-height:40px}
.chips button[aria-pressed="true"]{border-color:var(--pink);color:var(--pink)}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.msg2{color:var(--orange);font-family:var(--mono);min-height:1.6em;margin-top:10px}
.pc{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:6px}
.pc .em{font-size:2.6rem;line-height:1.1}
.pc .tt{color:var(--muted);font-size:.9rem}
.pc .rt{font:800 .72rem var(--mono);text-transform:uppercase;letter-spacing:.08em}
.pc .st{font:600 .85rem var(--mono);color:var(--cyan)}
.pc .aka{font-size:.85rem;color:var(--orange)}
.pc .bk{text-align:left;font-size:.92rem}
.pc .bk p{margin:0 0 6px}
.pc .gr{font:800 1.6rem var(--mono);color:var(--pink);transform:rotate(-4deg);display:inline-block}
.pc .bn{font:.7rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto}
.r-rare{border-color:var(--cyan)}
.r-epic{border-color:var(--pink);box-shadow:0 0 16px var(--pink)}
.r-legendary{border-color:var(--orange);box-shadow:0 0 22px var(--orange)}
.r-mythic{border-color:var(--violet);box-shadow:0 0 22px var(--violet)}
.r-rare .rt{color:var(--cyan)}.r-epic .rt{color:var(--pink)}.r-legendary .rt{color:var(--orange)}.r-mythic .rt{color:var(--violet)}
.mine{outline:3px dashed var(--orange);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="site-header"></div>
<div id="banner"></div>
<main id="main"><div class="wrap">

<section class="hero" style="padding-bottom:10px">
<h1>Class Registry</h1>
<p class="tag">23 coders. 0 working projects.</p>
<p class="sub">Every character here is made up. Flip a card, find your favourite, and battle two of them. Nothing leaves your device.</p>
</section>

<section aria-labelledby="yc">
<h2 id="yc">Your card</h2>
<div class="card">
<label for="nm">Your first name or nickname (stays on this device)</label>
<input type="text" id="nm" maxlength="20" autocomplete="off" placeholder="Optional">
<div class="row2"><button class="btn small" id="nsave" type="button">Save</button><button class="btn small alt" id="nclr" type="button">Sign out</button></div>
<p class="msg2" id="welcome" role="status"></p>
</div>
</section>

<section aria-labelledby="ct">
<h2 id="ct">Find a character</h2>
<div class="card">
<label for="q">Search</label><input type="search" id="q" maxlength="40" autocomplete="off" placeholder="Try: tabs, owl, semicolon">
<div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
<label for="srt">Sort by</label>
<select id="srt"><option value="def">Class order</option><option value="rarity">Rarity</option><option value="bugs">Most bugs</option><option value="tabs">Most tabs</option><option value="oksir">Most Ok sirs</option><option value="excuse">Best excuses</option></select>
<p class="msg2" id="cnt"></p>
</div>
</section>

<section aria-labelledby="sf"><h2 id="sf">Staff</h2><div class="grid" id="staff"></div></section>
<section aria-labelledby="gr"><h2 id="gr">The class</h2><div class="grid" id="grid"></div></section>

<section aria-labelledby="bt">
<h2 id="bt">Card battle</h2>
<div class="card">
<label for="ba">First fighter</label><select id="ba"></select>
<label for="bb">Second fighter</label><select id="bb"></select>
<div class="row2"><button class="btn" id="bgo" type="button">Battle</button></div>
<p class="msg2" id="bres" role="status"></p>
</div>
</section>

</div></main>
<div id="site-footer"></div>
<noscript><p style="padding:16px">The registry needs JavaScript. Sir E says: Please enable it.....</p></noscript>
<script src="site.js" defer></script>
<script src="roster.js" defer></script>
</body>
</html>
