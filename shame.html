<!DOCTYPE html>

<script>try{var t=localStorage.getItem("awc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
label{display:block;font-weight:700;margin:12px 0 6px}
input[type=text],select{width:100%;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:11px;font:16px var(--font)}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.out2{font:700 1.1rem var(--mono);color:var(--orange);min-height:2.4em;margin-top:12px;overflow-wrap:anywhere}
.msg2{min-height:1.6em;color:var(--orange);font-family:var(--mono);margin-top:10px}
.bk{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit;cursor:pointer;min-height:56px}
.bk:hover{border-color:var(--pink)}.bk b{display:block}
.det{margin-top:8px;color:var(--orange);font-family:var(--mono);font-size:.9rem}
.tip{margin-top:6px;color:var(--cyan);font-size:.9rem}
.bin{font:.72rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
[hidden]{display:none!important}
.cert{background:#fffdf4;color:#1d1238;border:10px double #5a24c7;border-radius:6px;padding:24px 16px;text-align:center;max-width:680px;margin:16px auto;font-family:Georgia,serif}
.cert h2{color:#c21d72;font-size:clamp(1.5rem,6vw,2.2rem);margin:.3em 0}.cert .nm{font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700;overflow-wrap:anywhere}.cert .sm{font:700 .8rem var(--font);letter-spacing:.12em;text-transform:uppercase;color:#7a6aa8}
table.tt{border-collapse:collapse;width:100%;min-width:560px;background:var(--card);font-size:.85rem}table.tt th,table.tt td{border:1px solid var(--line);padding:8px}table.tt th{background:var(--bg2)}table.tt .today{background:rgba(255,79,163,.18)}
.sc{overflow-x:auto}pre.code{background:#1e1f2b;color:#e8e8f0;border-radius:8px;padding:12px;font:14px/1.5 var(--mono);overflow-x:auto;margin:8px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;cursor:pointer;min-height:46px}.opt[aria-pressed="true"]{border-color:var(--pink);color:var(--pink)}
.pin{border-color:var(--orange)}.wanted{border:4px solid var(--orange);text-align:center}
@media print{body *{visibility:hidden}#certwrap,#certwrap *,#ttwrap,#ttwrap *{visibility:visible}#certwrap,#ttwrap{position:absolute;left:0;top:0;width:100%}#rain{display:none}}
</style>
</head>

document.addEventListener("DOMContentLoaded",function(){
"use strict";

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function bits(s){return Array.from(new TextEncoder().encode(s)).map(function(b){return b.toString(2).padStart(8,"0")}).join(" ")}
var H=[["Most tabs open at once","400","Tab Hoarder"],["Longest quick fix","3 days","Chief Excuse Officer"],["Most console.log in one file","87","Console.log Prophet"],["Biggest CSS file for one button","4,000 lines","Head of CSS Prayers"],["Most final-final-v2 folders","9","Variable Named X"],["Fastest to say I will do it tomorrow","0.2 seconds","Midnight Pusher"],["Longest time looking for a semicolon","6 hours","Captain Semicolon"],["Most pushes straight to main in one day","14","VP of Pushing to Main"],["Most Ok sirs in one lesson","99","Director of Dots"],["Bug that disappeared when watched","1","Heisenbug Hippo"]];

$("sf").onclick=draw;draw();
});
