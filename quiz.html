<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Coder Are You? A Funny 8-Question Quiz</title>
<meta name="description" content="Answer 8 quick questions and find out which fictional coder you are. Share your result. No sign-up, nothing saved online.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("awc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
.opt{display:block;width:100%;text-align:left;margin:10px 0;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:14px;font:inherit;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--pink)}
.prog{font:700 .9rem var(--mono);color:var(--cyan)}
.bar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--pink),var(--orange))}
.q{font-size:1.25rem;font-weight:800;margin:0 0 10px}
.res{text-align:center;border:3px solid var(--line)}
.res .em{font-size:4rem;line-height:1.1}
.res .rt{font:800 .8rem var(--mono);text-transform:uppercase;letter-spacing:.08em}
.r-rare{border-color:var(--cyan)}.r-epic{border-color:var(--pink);box-shadow:0 0 18px var(--pink)}.r-common{border-color:var(--line)}
.row2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.msg2{color:var(--orange);font-family:var(--mono);min-height:1.6em;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="site-header"></div>
<div id="banner"></div>
<main id="main"><div class="wrap">
<section class="hero" style="padding-bottom:10px">
<h1>Which coder are you?</h1>
<p class="tag">8 questions. 23 fictional coders.</p>
<p class="sub">Nothing is saved online. Your answers stay in this page.</p>
</section>
<section class="card" id="qbox" aria-live="polite">
<div class="prog" id="prog"></div><div class="bar"><i id="fill"></i></div>
<p class="q" id="qt"></p><div id="opts"></div>
</section>
<section class="card res" id="res" hidden>
<div class="em" id="rem"></div><h2 id="rname" style="margin:.2em 0"></h2>
<div class="muted" id="rtit"></div><div class="rt" id="rrar"></div>
<p id="rroast" style="margin-top:12px"></p><p id="rsir" style="color:var(--orange)"></p>
<div class="row2">
<button class="btn" id="share" type="button">Copy my result</button>
<button class="btn alt" id="claim" type="button">Save as my card</button>
<button class="btn alt" id="again" type="button">Take it again</button>
</div>
<p class="msg2" id="msg" role="status"></p>
<p><a href="roster.html">See all 23 characters</a></p>
</section>
</div></main>
<div id="site-footer"></div>
<noscript><p style="padding:16px">The quiz needs JavaScript. Sir E says: Please enable it.....</p></noscript>
<script src="site.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded",function(){
"use strict";
var $=function(i){return document.getElementById(i)},A=window.AWC||{},ls=A.ls||{get:function(k,d){return d},set:function(){}};
/* Each question: text, answers [label, value 1-5], axis (0 neat, 1 fast, 2 bold) */
var Q=[
["Your desktop right now:",[["Everything in neat folders",5],["A few files, mostly fine",3],["Forty tabs and final-final-v2",1]],0],
["Your code comments are:",[["Clear and helpful",5],["Mostly TODO",3],["magic, do not touch",1]],0],
["Before starting a project you:",[["Make a plan",5],["Think for two minutes",3],["Just start typing",1]],0],
["Your typing speed is:",[["Lightning, with typos",5],["Normal",3],["Slow and careful",1]],1],
["Your working style is:",[["Type first, think later",5],["Type and think together",3],["Think first, type later",1]],1],
["A new bug appears. You:",[["Charge in and fix it",5],["Read the error first",3],["Take a break and think",1]],1],
["Push straight to main?",[["Always, no fear",5],["Sometimes",3],["Only after a branch",1]],2],
["A new tool appears. You:",[["Try it right now",5],["Watch a tutorial first",3],["Wait until others try it",1]],2]
];
var P=[],i=0,S,C,picked=null;
function nearest(v){var b=null,bd=1e9;P.forEach(function(p){var d=0;for(var k=0;k<3;k++){var x=p.traits[k]-v[k];d+=x*x}if(d<bd){bd=d;b=p}});return b}
window.AWC_QUIZ={Q:Q,nearest:nearest,set:function(p){P=p}};
function ask(){var q=Q[i];$("prog").textContent="Question "+(i+1)+" of "+Q.length;$("fill").style.width=(i/Q.length*100)+"%";
 $("qt").textContent=q[0];var o=$("opts");o.textContent="";
 q[1].forEach(function(a){var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=a[0];
  b.onclick=function(){S[q[2]]+=a[1];C[q[2]]++;i++;if(i<Q.length)ask();else finish()};o.append(b)});
 if(o.firstChild&&i>0)o.firstChild.focus()}
function finish(){
 picked=nearest(S.map(function(s,k){return s/C[k]}));
 $("qbox").hidden=true;$("res").hidden=false;$("res").className="card res r-"+String(picked.rarity).toLowerCase();
 $("rem").textContent=picked.emoji;$("rname").textContent=picked.name;$("rtit").textContent=picked.title;$("rrar").textContent=picked.rarity;
 $("rroast").textContent=picked.roast;$("rsir").textContent="Sir E: "+picked.comment;$("msg").textContent="";$("res").scrollIntoView({behavior:"smooth",block:"start"})}
function start(){i=0;S=[0,0,0];C=[0,0,0];picked=null;$("res").hidden=true;$("qbox").hidden=false;ask()}
$("again").onclick=start;
$("share").onclick=function(){if(!picked)return;var t="I am "+picked.name+" ("+picked.rarity+") in the Department of Almost Working Code. Sir E said Ok.....";
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){$("msg").textContent="Copied."},function(){$("msg").textContent=t});else $("msg").textContent=t};
$("claim").onclick=function(){if(!picked)return;ls.set("awc-claim",picked.id);$("msg").textContent="Saved on this device. Open the Class Registry to see your card."};
fetch("people.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){P=(d.people||[]).filter(function(p){return !p.hidden});if(!P.length)throw 0;start()})
 .catch(function(){$("qt").textContent="Could not load people.json. Open this page on the website, not as a local file."});
});
</script>
</body>
</html>
