<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Guessing: Read and Build Binary Numbers</title>
<meta name="description" content="A binary number game. Read a binary number and pick its value, or tap the bits to build a number. Easy, normal and hard modes.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("awc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
.hud{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font:700 1.05rem var(--mono);color:var(--cyan);margin:12px 0}
.q{font-size:1.2rem;font-weight:800;margin:10px 0}
.bigbin{font:800 clamp(1.6rem,8vw,2.6rem) var(--mono);color:var(--cyan);letter-spacing:.12em;margin:10px 0}
.opts{max-width:420px;margin:0 auto}
.opt{display:block;width:100%;margin:8px 0;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:12px;font:700 1.2rem var(--mono);cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--pink)}.opt.ok{border-color:#2ee59d;background:#12382b;color:#fff}.opt.bad{border-color:#ff5c5c;background:#3d1620;color:#fff}
.bits{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px;font:.75rem var(--mono);color:var(--muted)}
.bit button{width:44px;height:52px;font:800 1.4rem var(--mono);background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:8px;cursor:pointer}
.bit button[aria-pressed="true"]{background:var(--violet);color:#fff;border-color:var(--pink)}
.exp{max-width:560px;margin:10px auto;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-family:var(--mono)}
.res{font:700 1.15rem var(--mono);color:var(--orange);min-height:2em}
select{background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.ctr{text-align:center}[hidden]{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="site-header"></div>
<main id="main"><div class="wrap ctr">
<section class="hero" style="padding-bottom:6px">
<h1>Binary Guessing</h1>
<p class="sub" style="margin:0 auto">Ten rounds. Some ask you to read a binary number. Others ask you to build one by tapping the bits. Easy uses 4 bits, Normal 6 and Hard 8.</p>
</section>
<p><label for="df">Difficulty: </label><select id="df"><option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option></select></p>
<div class="hud"><span id="pg">Ready</span><span>Score: <b id="sc">0</b></span><span>Best: <b id="bs">0</b></span></div>
<div id="board" hidden>
<p class="q" id="qt"></p>
<div class="bigbin" id="bin" hidden></div>
<div class="opts" id="opts"></div>
<div id="build" hidden><div class="bits" id="bits"></div><p>Your number: <b id="cur">0</b></p><button class="btn" id="chk" type="button">Check</button></div>
</div>
<div class="exp" id="exp" hidden role="status"></div>
<div class="res" id="res" role="status"></div>
<p><button class="btn" id="go" type="button">Start game</button> <button class="btn alt" id="nx" type="button" hidden>Next</button> <button class="btn alt" id="sh" type="button" hidden>Copy result</button></p>
<p><a href="games.html">Back to the Games Arcade</a> &nbsp; <a href="binary.html">Open the Binary Lab</a></p>
</div></main>
<div id="site-footer"></div>
<noscript><p style="padding:16px">This game needs JavaScript. Sir E says: Please enable it.....</p></noscript>
<script src="site.js" defer></script>
<script src="games-core.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded",function(){
"use strict";
var GC=window.GC,$=function(i){return document.getElementById(i)},NAME="binary-guess",N=10,BITS={easy:4,normal:6,hard:8};
var i=0,score=0,cur=null,state=[],done=false;
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function bin(v,b){return v.toString(2).padStart(b,"0")}
function expl(v,b){var p=[];for(var k=b-1;k>=0;k--)if(v&(1<<k))p.push(1<<k);return bin(v,b)+" = "+(p.length?p.join(" + "):"0")+" = "+v}
function opts(v,b){var max=(1<<b)-1,c=[v^1,v^2,v^4,(v+1)%(max+1),(v+3)%(max+1)].filter(function(x,k,a){return x!==v&&x<=max&&a.indexOf(x)===k});
 return shuf([v].concat(shuf(c).slice(0,2)))}
$("df").value=GC.diff();$("df").onchange=function(){GC.setDiff($("df").value)};$("bs").textContent=GC.best(NAME);
function ask(){
 var b=BITS[GC.diff()],v=Math.floor(Math.random()*(1<<b));cur={v:v,b:b,read:i%2===0};done=false;
 $("exp").hidden=true;$("nx").hidden=true;$("res").textContent="";$("pg").textContent="Round "+(i+1)+" of "+N;$("board").hidden=false;
 $("opts").textContent="";$("bin").hidden=!cur.read;$("build").hidden=cur.read;
 if(cur.read){$("qt").textContent="What number is this?";$("bin").textContent=bin(v,b);
  opts(v,b).forEach(function(x){var e=document.createElement("button");e.type="button";e.className="opt";e.textContent=x;e.onclick=function(){finish(x===v,e)};$("opts").append(e)})}
 else{$("qt").textContent="Build the number "+v;state=[];$("bits").textContent="";$("cur").textContent=0;
  for(var k=b-1;k>=0;k--){(function(k){state[k]=0;var w=document.createElement("div");w.className="bit";var bt=document.createElement("button");bt.type="button";bt.textContent="0";bt.setAttribute("aria-pressed","false");
   bt.setAttribute("aria-label","Bit worth "+(1<<k));bt.onclick=function(){if(done)return;state[k]^=1;bt.textContent=state[k];bt.setAttribute("aria-pressed",state[k]===1);var t=0;state.forEach(function(x,j){if(x)t+=1<<j});$("cur").textContent=t};
   w.append(bt,document.createTextNode(String(1<<k)));$("bits").append(w)})(k)}}
}
function finish(ok,btn){
 if(done)return;done=true;if(ok)score++;$("sc").textContent=score;
 if(cur.read){Array.prototype.forEach.call($("opts").children,function(x){if(+x.textContent===cur.v)x.className="opt ok"});if(!ok&&btn)btn.className="opt bad"}
 $("exp").hidden=false;$("exp").textContent=(ok?"Correct! ":"Not quite. ")+expl(cur.v,cur.b);
 $("nx").hidden=false;$("nx").textContent=i+1<N?"Next":"See result";
}
$("chk").onclick=function(){if(done)return;var t=0;state.forEach(function(x,j){if(x)t+=1<<j});finish(t===cur.v)};
function end(){
 $("board").hidden=true;$("exp").hidden=true;$("nx").hidden=true;$("pg").textContent="Finished";
 var nb=GC.setBest(NAME,score);$("bs").textContent=GC.best(NAME);GC.award("first");if(score===N)GC.award("brain");
 $("res").textContent="Score: "+score+" of "+N+". "+(score===N?"Binary Brain! Sir E: Ok.....":score>=7?"Not bad. Suspicious.....":score>=4?"See me after class.....":"Please read the question again.....")+(nb&&score>0?" New best!":"");
 $("go").disabled=false;$("df").disabled=false;$("go").textContent="Play again";$("sh").hidden=false;
}
$("nx").onclick=function(){i++;if(i<N)ask();else end()};
$("go").onclick=function(){i=0;score=0;$("sc").textContent=0;$("sh").hidden=true;$("go").disabled=true;$("df").disabled=true;ask()};
$("sh").onclick=function(){var t=GC.share("Binary Guessing",score+" out of "+N);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){$("res").textContent="Copied."},function(){});else $("res").textContent=t};
window.AWC_BG={opts:opts,expl:expl,bin:bin};
});
</script>
</body>
</html>
