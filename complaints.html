<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complaints Desk: Wi-Fi, Batteries and the Class Fan</title>
<meta name="description" content="File a funny complaint about the Wi-Fi, laptop batteries or the class fan. Ticket number one is still not working.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("awc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
label{display:block;font-weight:700;margin:12px 0 6px}
input[type=text],select{width:100%;background:var(--bg2);color:var(--text);border:2px solid var(--line);border-radius:8px;padding:11px;font:16px var(--font)}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.out2{font:700 1.1rem var(--mono);color:var(--orange);min-height:2.4em;margin-top:12px;overflow-wrap:anywhere}
.msg2{min-height:1.6em;color:var(--orange);font-family:var(--mono);margin-top:10px}
.bk{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit;cursor:pointer;min-height:56px}
.bk:hover{border-color:var(--pink)}.bk b{display:block}
.det{margin-top:8px;color:var(--orange);font-family:var(--mono);font-size:.9rem}
.tip{margin-top:6px;color:var(--cyan);font-size:.9rem}
.bin{font:.72rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="site-header"></div>
<div id="banner"></div>
<main id="main"><div class="wrap">
<section class="hero" style="padding-bottom:10px">
<h1>Complaints Desk</h1>
<p class="tag">Wi-Fi, batteries and the class fan.</p>
<p class="sub">File a complaint and get a ticket. Please do not type names or personal details. Tickets stay on this device.</p>
</section>
<section class="card">
<label for="cat">Category</label>
<select id="cat"><option>Wi-Fi</option><option>Laptop battery</option><option>The class fan</option><option>Too many bugs</option><option>Something else</option></select>
<label for="txt">What is the problem? (short)</label>
<input type="text" id="txt" maxlength="80" autocomplete="off" placeholder="The Wi-Fi left without saying goodbye">
<div class="row2"><button class="btn" id="go" type="button">File complaint</button><button class="btn alt small" id="clr" type="button">Clear my tickets</button></div>
<p class="msg2" id="msg" role="status"></p>
</section>
<section aria-labelledby="tk"><h2 id="tk" style="margin-top:22px">Tickets</h2><div class="grid" id="list"></div></section>
</div></main>
<div id="site-footer"></div>
<noscript><p style="padding:16px">This page needs JavaScript. Sir E says: Please enable it.....</p></noscript>
<script src="site.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded",function(){
"use strict";
var $=function(i){return document.getElementById(i)},A=window.AWC||{},ls=A.ls||{get:function(k,d){return d},set:function(){}};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function bits(s){return Array.from(new TextEncoder().encode(s)).map(function(b){return b.toString(2).padStart(8,"0")}).join(" ")}
var BAD=/\b(fuck|shit|bitch|idiot|stupid|dumb)\b/i,PRIV=/(\d[\d\s\-]{6,}\d|\S+@\S+\.\S+)/;
var T=[];try{T=JSON.parse(ls.get("awc-tickets","[]"));if(!Array.isArray(T))T=[]}catch(e){T=[]}
var RP=["Ok.....","I will report it.....","Noted.....","Please read the question again.....","I will look into it tomorrow....."];
function draw(){var l=$("list");l.textContent="";
 var f=el("div","card");f.append(el("h3","","Ticket #1: The class fan"),el("p","muted","Status: Still not working....."),el("p","","Sir E: I will report the fan.....\uD83D\uDE4F"));l.append(f);
 T.forEach(function(t){var c=el("div","card");c.append(el("h3","","Ticket #"+t[0]+": "+t[1]),el("p","muted",t[2]),el("p","","Status: Under investigation....."),el("p","","Sir E: "+t[3]));l.append(c)})}
$("go").onclick=function(){var x=$("txt").value.trim().slice(0,80),m=$("msg");
 if(!x){m.textContent="Describe the problem first.";return}
 if(PRIV.test(x)){m.textContent="Please do not type phone numbers or emails. Sir E: Keep your details private.....";return}
 if(BAD.test(x)){m.textContent="Please keep it respectful.....";return}
 var n=T.length?T[T.length-1][0]+1:2,cat=$("cat").value;
 T.push([n,cat,x,cat==="The class fan"?"I will report the fan.....":pick(RP)]);if(T.length>15)T.shift();
 ls.set("awc-tickets",JSON.stringify(T));$("txt").value="";m.textContent="Ticket #"+n+" filed. Sir E: Ok.....";draw()};
$("clr").onclick=function(){T=[];ls.set("awc-tickets","[]");$("msg").textContent="Your tickets were cleared. Ticket #1 stays.";draw()};
draw();
});
</script>
</body>
</html>
