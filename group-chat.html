<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Group Chat Archive: A Fictional Coding Class Chat</title>
<meta name="description" content="A made-up class group chat full of Ok sirs, binary messages you can tap to decode, deleted messages and a missed voice call with 1 joined.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("awc-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<style>
.chat{max-width:560px;margin:14px auto;background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--glow)}
.top{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--bg2);border-bottom:2px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.top small{color:var(--cyan);font-family:var(--mono)}
.log{padding:14px;display:flex;flex-direction:column;gap:8px;min-height:300px;max-height:70vh;overflow-y:auto}
.m{max-width:86%;padding:7px 11px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.m .s{font:700 .78rem var(--mono);display:block;margin-bottom:2px}
.m .t{font:.7rem var(--mono);color:var(--muted);display:block;text-align:right}
.m.sir{border-color:var(--pink)}
.m.sys{align-self:center;background:none;border:0;color:var(--muted);font:.82rem var(--mono);text-align:center}
.m.del{font-style:italic;color:var(--muted)}
.m.call{border-color:var(--orange);color:var(--orange);font-family:var(--mono);font-size:.9rem}
button.m{cursor:pointer;color:var(--cyan);font:.82rem/1.5 var(--mono);text-align:left;border-color:var(--cyan)}
.dec{display:block;color:var(--orange);font-weight:700;margin-top:4px}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.ctr{text-align:center}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="site-header"></div>
<div id="banner"></div>
<main id="main"><div class="wrap">
<section class="hero ctr" style="padding-bottom:10px">
<h1>Group Chat Archive</h1>
<p class="tag">Missed voice call: 1 joined.</p>
<p class="sub" style="margin:0 auto">A made-up class chat. Every name and message here is fictional. Tap a binary message to decode it.</p>
</section>
<div class="chat">
<div class="top"><div class="av" aria-hidden="true">DS</div><div><b>The Debugging Society (parody)</b><br><small id="st">23 fictional members</small></div></div>
<div class="log" id="log" role="log" aria-label="Chat messages"></div>
</div>
<div class="row2"><button class="btn small" id="rp" type="button">Replay the chat</button><button class="btn small alt" id="all" type="button">Show everything</button></div>
<p class="muted ctr">Parody. Not a real chat and not any real person.</p>
</div></main>
<div id="site-footer"></div>
<noscript><p style="padding:16px">This page needs JavaScript. Sir E says: Please enable it.....</p></noscript>
<script src="site.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded",function(){
"use strict";
var $=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function bits(s){return Array.from(new TextEncoder().encode(s)).map(function(b){return b.toString(2).padStart(8,"0")}).join(" ")}
function un(b){return new TextDecoder().decode(new Uint8Array(b.split(" ").map(function(x){return parseInt(x,2)})))}
/* ===== MESSAGES: [type, sender, text, time]. Types: m message, sir, sys, del, call, bin (text is the secret) ===== */
var M=[
["sys","","Sir E created this group","8:00"],
["sir","Sir E","Good morning class.....","8:01"],
["m","Captain Semicolon","Ok sir","8:01"],
["m","Tab Hoarder","Ok sir","8:02"],
["m","Null Pointer Pigeon","Ok sir","8:02"],
["sir","Sir E","Hands up if your laptop is ready.....","8:03"],
["sys","","Poll: Ready 23 | Not ready this week 0","8:03"],
["m","Director of Dots","....."," 8:04"],
["bin","Minister of Binary","Hi","8:05"],
["bin","Minister of Binary","Ok sir","8:05"],
["m","Heisenbug Hippo","The bug was here a minute ago","8:09"],
["sir","Sir E","Make sure it is public.....\uD83D\uDE4F","8:10"],
["del","Sir E","This message was deleted","8:11"],
["call","","Missed voice call \u00B7 4 mins \u00B7 1 joined","8:20"],
["m","Works-On-My-Machine Wizard","It works on my machine","8:31"],
["sir","Sir E","Show me on another machine.....","8:32"],
["m","Chief Excuse Officer","Sorry sir, the Wi-Fi was in a meeting","8:35"],
["m","Midnight Pusher","pushed to main","11:59"],
["sir","Sir E","Make a branch first.....\uD83D\uDE4F","12:00"],
["sys","","Sir E left the group","12:01"]
];
/* ====================================================================================================== */
var COL=["#ff4fa3","#38e1ff","#ff9a3c","#b58cff","#2ee59d","#ffd166"];
function color(n){var h=0;for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%COL.length;return COL[h]}
function bubble(m){
 var t=m[0],b;
 if(t==="sys"||t==="call"||t==="del"){b=el("div","m "+t,t==="del"?m[2]:m[2]);if(t==="del"){var s=el("span","s",m[1]);s.style.color="var(--pink)";b.prepend(s)}return b}
 if(t==="bin"){b=el("button","m");b.type="button";var s2=el("span","s",m[1]);s2.style.color=color(m[1]);var code=bits(m[2]);b.append(s2,document.createTextNode(code));
  b.setAttribute("aria-label",m[1]+" sent a binary message. Tap to decode.");var open=false,d=el("span","dec","Decoded: "+m[2]);
  b.onclick=function(){open=!open;if(open)b.append(d);else d.remove()};return b}
 b=el("div","m"+(t==="sir"?" sir":""));var s3=el("span","s",m[1]);s3.style.color=color(m[1]);
 b.append(s3,document.createTextNode(m[2]),el("span","t",m[3].trim()));return b}
function showAll(){var l=$("log");l.textContent="";M.forEach(function(m){l.append(bubble(m))});l.scrollTop=l.scrollHeight}
var tm=null;
function replay(){var l=$("log"),i=0;clearInterval(tm);l.textContent="";$("st").textContent="typing.....";
 tm=setInterval(function(){if(i>=M.length){clearInterval(tm);$("st").textContent="23 fictional members";return}l.append(bubble(M[i++]));l.scrollTop=l.scrollHeight},650)}
$("rp").onclick=replay;$("all").onclick=function(){clearInterval(tm);$("st").textContent="23 fictional members";showAll()};
showAll();
window.AWC_GC={M:M,un:un,bits:bits};
});
</script>
</body>
</html>
